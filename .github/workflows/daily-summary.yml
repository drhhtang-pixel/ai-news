name: Daily AI News Summary

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 08:00 Taiwan (UTC+8)
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # open a review issue for stories held back as too old

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent (fetch + summarize + verify)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          HELD_FILE: ${{ runner.temp }}/held_stories.md
        run: python3 agent.py

      # Runs even if the agent failed afterwards (e.g. every headline was held), so the
      # manager still hears about the held stories.
      - name: Ask the manager to review stories older than a month
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HELD_FILE: ${{ runner.temp }}/held_stories.md
        run: |
          if [ -s "$HELD_FILE" ]; then
            gh issue create \
              --title "Review older AI news stories held on $(date -u +%Y-%m-%d)" \
              --body-file "$HELD_FILE"
          else
            echo "No stories held for review."
          fi

      - name: Regenerate static HTML
        run: python3 publish.py

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add summaries.md docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily summary $(date -u +%Y-%m-%d)"
          # Rebase onto latest main in case another push landed during the run
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Failed to push after 3 attempts"
          exit 1

  # Pushes made with GITHUB_TOKEN do not trigger pages.yml, so deploy here.
  deploy:
    needs: summarize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
